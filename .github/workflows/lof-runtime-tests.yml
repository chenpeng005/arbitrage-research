name: LOF Runtime Tests

on:
  push:
    paths:
      - "runtime/lof/**"
      - "runtime/deployment_gate.py"
      - "tests/test_lof_*.py"
      - "tests/test_deployment_gate.py"
      - ".github/workflows/lof-runtime-tests.yml"
  pull_request:
    paths:
      - "runtime/lof/**"
      - "runtime/deployment_gate.py"
      - "tests/test_lof_*.py"
      - "tests/test_deployment_gate.py"
      - ".github/workflows/lof-runtime-tests.yml"
  workflow_dispatch:

concurrency:
  group: lof-runtime-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LOF lightweight test dependency
        run: python -m pip install "xlrd>=2.0,<3"

      - name: Run LOF unit tests
        run: python -m unittest discover -s tests -p "test_lof_*.py" -v

      - name: Run shared deployment gate regression tests
        run: python -m unittest tests.test_deployment_gate -v
