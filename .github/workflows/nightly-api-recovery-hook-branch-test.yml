name: Validate Nightly API Recovery Hook

on:
  push:
    branches:
      - fix/nightly-api-recovery-hook-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r runtime/requirements.txt
      - name: Validate shell
        run: bash -n scripts/production/nightly-ai-mode-switch.sh scripts/production/deploy-from-github.sh
      - name: Run recovery tests
        run: |
          python -m unittest discover -s tests -p 'test_chat_to_api_recovery_v1.py' -v
          python -m unittest discover -s tests -p 'test_nightly_ai_mode_switch_recovery_v1.py' -v
