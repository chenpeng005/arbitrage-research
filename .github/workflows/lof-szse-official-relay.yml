name: LOF SZSE Official Relay

on:
  push:
    paths:
      - ".github/workflows/lof-szse-official-relay.yml"
      - "runtime/lof/http_json.py"
      - "runtime/lof/universe.py"
      - "runtime/lof/nav.py"
      - "runtime/lof/szse_relay.py"
      - "runtime/lof/szse_relay_publish.py"
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "10 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lof-szse-official-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and validate official SZSE LOF data
        run: |
          rm -rf /tmp/lof-relay
          python -m runtime.lof.szse_relay_publish \
            --output-dir /tmp/lof-relay/lof_relay \
            --timeout 20 \
            --nav-workers 6

      - name: Publish last-good relay branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan lof-relay-publish
          git rm -rf .
          mkdir -p lof_relay
          cp -a /tmp/lof-relay/lof_relay/. lof_relay/

          git add lof_relay
          git commit -m "LOF relay: update SZSE official snapshot"
          git push --force origin HEAD:lof-data-relay
