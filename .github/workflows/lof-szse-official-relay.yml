name: LOF SZSE Official Relay

on:
  push:
    paths:
      - ".github/workflows/lof-szse-official-relay.yml"
      - "runtime/lof/http_json.py"
      - "runtime/lof/universe.py"
      - "runtime/lof/nav.py"
      - "runtime/lof/szse_relay.py"
  workflow_dispatch:
  schedule:
    - cron: "50 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lof-szse-official-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and validate official SZSE LOF data
        env:
          LOF_SZSE_RELAY_BASE_URL: ""
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from runtime.lof.nav import fetch_szse_official_nav
          from runtime.lof.szse_relay import RELAY_VERSION
          from runtime.lof.universe import fetch_szse_universe

          out = Path("/tmp/lof-relay/lof_relay")
          out.mkdir(parents=True, exist_ok=True)

          universe = fetch_szse_universe(
              timeout=20,
              relay_base_url=None,
          )
          if len(universe) < 200:
              raise RuntimeError(
                  f"SZSE universe sanity failed: {len(universe)}"
              )

          nav_rows = fetch_szse_official_nav(
              [row.code for row in universe],
              timeout=20,
              max_workers=6,
          )
          available_nav = [row for row in nav_rows if row.available]
          coverage = len(available_nav) / len(universe)
          if coverage < 0.90:
              raise RuntimeError(
                  "SZSE NAV coverage sanity failed: "
                  f"{len(available_nav)}/{len(universe)}={coverage:.2%}"
              )

          fetched_at = datetime.now(timezone.utc).isoformat()

          universe_payload = {
              "relay_version": RELAY_VERSION,
              "source": "SZSE_OFFICIAL",
              "source_url": (
                  "https://www.szse.cn/api/report/ShowReport/data"
                  "?SHOWTYPE=JSON&CATALOGID=fund_lof"
              ),
              "fetched_at": fetched_at,
              "rows": [
                  {
                      "code": row.code,
                      "name": row.name,
                      "manager": row.manager,
                      "listing_date": row.listing_date,
                  }
                  for row in universe
              ],
          }

          nav_payload = {
              "relay_version": RELAY_VERSION,
              "source": "SZSE_OFFICIAL",
              "source_url": (
                  "https://www.szse.cn/api/report/ShowReport/data"
                  "?SHOWTYPE=JSON&CATALOGID=fund_jjjz"
              ),
              "fetched_at": fetched_at,
              "rows": [
                  {
                      "code": row.code,
                      "nav": str(row.nav),
                      "nav_date": row.nav_date.isoformat(),
                  }
                  for row in available_nav
              ],
          }

          universe_path = out / "szse_universe.json"
          nav_path = out / "szse_nav.json"

          universe_path.write_text(
              json.dumps(
                  universe_payload,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          nav_path.write_text(
              json.dumps(
                  nav_payload,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "relay_version": RELAY_VERSION,
              "source": "SZSE_OFFICIAL",
              "fetched_at": fetched_at,
              "application_source_commit": __import__("os").environ["GITHUB_SHA"],
              "universe_count": len(universe),
              "nav_count": len(available_nav),
              "nav_coverage": coverage,
              "files": {
                  "universe": {
                      "filename": "szse_universe.json",
                      "sha256": sha256(universe_path),
                  },
                  "nav": {
                      "filename": "szse_nav.json",
                      "sha256": sha256(nav_path),
                  },
              },
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  {
                      "universe_count": len(universe),
                      "nav_count": len(available_nav),
                      "nav_coverage": coverage,
                      "fetched_at": fetched_at,
                  },
                  ensure_ascii=False,
              )
          )
          PY

      - name: Publish last-good relay branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan lof-relay-publish
          git rm -rf .
          mkdir -p lof_relay
          cp -a /tmp/lof-relay/lof_relay/. lof_relay/

          git add lof_relay
          git commit -m "LOF relay: update SZSE official snapshot"
          git push --force origin HEAD:lof-data-relay
