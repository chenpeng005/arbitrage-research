name: Validate Convertible Runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "scripts/production/**"
      - "tests/**"
      - ".github/workflows/deploy-convertible-runtime.yml"
  workflow_dispatch:

concurrency:
  group: convertible-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r runtime/requirements.txt

      - name: Source sanitation
        shell: bash
        run: |
          if grep -R "\[executed on device:" runtime scripts/production \
            --include='*.py' --include='*.sh' -n; then
            echo "Remote wrapper contamination detected"
            exit 1
          fi

      - name: Validate production shell scripts
        shell: bash
        run: |
          find scripts/production -type f -name '*.sh' -print0 | \
            xargs -0 -r -n1 bash -n

      - name: Compile critical runtime
        run: |
          python -m py_compile             runtime/opportunity/research_trigger.py             runtime/opportunity/full_runtime_controller.py             runtime/opportunity/incremental_information_controller.py             runtime/market_map/acquisition.py             runtime/market_map/calculation.py             runtime/web/app.py

      - name: Run convertible deployment tests
        shell: bash
        run: |
          for pattern in             test_daily_research_decoupling_v1.py             test_token_cost_gate_v1.py             test_reminder_policy_v2.py             test_information_change_source_fk_v1.py             test_deployment_gate.py
          do
            python -m unittest discover -s tests -p "$pattern" -v
          done

