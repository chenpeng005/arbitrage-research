name: LOF Live Snapshot Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lof-live-smoke.yml"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate one live LOF snapshot
        run: |
          mkdir -p /tmp/lof-live-smoke
          python -m runtime.lof.snapshot_job \
            --data-root /tmp/lof-live-smoke \
            --timeout 20 \
            --max-quote-age-seconds 180 \
            --snapshot-id github-live-smoke \
            --sse-universe-fixture tests/fixtures/lof_sse_universe_2026-09-29.json \
            --szse-universe-fixture tests/fixtures/lof_szse_universe_2026-09-29.json \
            --official-nav-fixture tests/fixtures/lof_official_nav_cloud_smoke_2026-09-29.json

      - name: Validate all-market snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/lof-live-smoke/latest_market_snapshot.json")
          snapshot = json.loads(p.read_text(encoding="utf-8"))
          rows = snapshot.get("rows") or []
          universe = int(snapshot.get("universe_count") or 0)
          quality = snapshot.get("quality_summary") or {}
          estimated = int(quality.get("estimated_nav_available_count") or 0)

          assert universe >= 300, f"unexpected universe_count={universe}"
          assert len(rows) == universe, (len(rows), universe)
          assert estimated > 0, "estimated NAV lane produced zero live values"

          required_row_fields = {
              "code",
              "name",
              "resolver_class",
              "price",
              "volume",
              "amount",
              "estimated_nav",
              "estimated_premium_rate",
              "estimated_nav_quality",
              "estimated_nav_status",
              "official_nav",
              "official_nav_date",
              "subscription_status",
              "daily_subscription_limit",
              "quote_time",
          }
          assert rows, "snapshot rows empty"
          missing = sorted(required_row_fields - set(rows[0]))
          assert not missing, f"snapshot row missing web fields: {missing}"

          available_rows = [
              row for row in rows
              if row.get("estimated_nav_status") == "AVAILABLE"
          ]
          assert available_rows, "no AVAILABLE estimated NAV row"
          for row in available_rows[:20]:
              assert row.get("estimated_nav") is not None, row.get("code")
              assert row.get("estimated_premium_rate") is not None, row.get("code")
              assert row.get("estimated_nav_quality") is not None, row.get("code")

          summary = {
              "collector_status": snapshot.get("collector_status"),
              "universe_count": universe,
              "row_count": len(rows),
              "quote_fresh_count": quality.get("quote_fresh_count"),
              "quote_stale_count": quality.get("quote_stale_count"),
              "quote_unavailable_count": quality.get("quote_unavailable_count"),
              "official_nav_available_count": quality.get("official_nav_available_count"),
              "official_nav_unavailable_count": quality.get("official_nav_unavailable_count"),
              "estimated_nav_available_count": estimated,
              "estimated_nav_stale_count": quality.get("estimated_nav_stale_count"),
              "estimated_nav_unavailable_count": quality.get("estimated_nav_unavailable_count"),
              "state_available_count": quality.get("state_available_count"),
              "lane_errors": snapshot.get("lane_errors"),
              "web_required_fields_checked": sorted(required_row_fields),
              "available_estimate_sample_count": min(20, len(available_rows)),
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          Path("/tmp/lof-live-smoke/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install web smoke dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"

      - name: Smoke FastAPI with generated snapshot
        run: |
          export LOF_RUNTIME_DATA_ROOT=/tmp/lof-live-smoke
          python -m uvicorn runtime.lof.web_app:app --host 127.0.0.1 --port 8095 > /tmp/lof-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID 2>/dev/null || true' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          base = "http://127.0.0.1:8095"

          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=2) as r:
                      health = json.loads(r.read().decode("utf-8"))
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.5)
          else:
              raise RuntimeError(f"web app did not become ready: {last_error}")

          assert health["status"] == "PASS", health
          assert int(health["universe_count"]) >= 300, health

          with urllib.request.urlopen(base + "/api/lof/snapshot", timeout=5) as r:
              snapshot = json.loads(r.read().decode("utf-8"))
          assert len(snapshot.get("rows") or []) == snapshot.get("universe_count")

          with urllib.request.urlopen(base + "/", timeout=5) as r:
              html = r.read().decode("utf-8")
          assert "LOF 全市场监控" in html
          assert "实时估值" in html
          assert "申购限额" in html

          result = {
              "health": health,
              "snapshot_rows": len(snapshot.get("rows") or []),
              "homepage_ok": True,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          Path("/tmp/lof-live-smoke/web_smoke.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload smoke snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lof-live-smoke
          path: |
            /tmp/lof-live-smoke/latest_market_snapshot.json
            /tmp/lof-live-smoke/summary.json
            /tmp/lof-live-smoke/web_smoke.json
          if-no-files-found: ignore
          retention-days: 7
