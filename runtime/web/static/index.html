<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>机会发现运行台 · 市场价值映射构建器</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">机会发现运行台</p>
        <h1>市场价值映射构建器 · 单元测试</h1>
        <p class="sub">网页触发 → 程序控制 → 数据获取与审计 → 逐步反馈 → 结果持久化</p>
      </div>
      <div id="overall" class="overall idle">尚未运行</div>
    </header>

    <section class="control card">
      <div>
        <label>运行模式</label>
        <select id="mode">
          <option value="LIVE_TEST">盘中测试</option>
          <option value="CLOSE">正式收盘截面</option>
        </select>
      </div>
      <div>
        <label>市场截面日期</label>
        <input id="cutoff" type="date">
      </div>
      <button id="runBtn">运行数据获取单元</button>
    </section>

    <section id="runMeta" class="meta card muted">
      尚未运行。点击按钮后程序自动推进；只有出现“需要人工处理”时才暂停。
    </section>

    <section class="progress card">
      <div class="progress-head"><strong>运行进度</strong><span id="progressText">0 / 7</span></div>
      <div class="track"><i id="bar"></i></div>
    </section>

    <section id="summary" class="summary card hidden">
      <div class="section-head">
        <div><p class="eyebrow">本次运行结果</p><h2>数据准备汇总</h2></div>
      </div>
      <div id="summaryMetrics" class="summary-grid"></div>
    </section>

    <section id="steps" class="steps"></section>

    <section class="card tech">
      <details>
        <summary>技术说明</summary>
        <p>主界面只展示业务上有意义的步骤；原始数据、异常对象和完整 JSON 同时保存在服务器运行记录中。</p>
      </details>
    </section>
  </main>
<script src="static/app.js"></script>
</body>
</html>
